name: Propose an established open problem
description: Suggest a sourced problem with bounded statement, status, literature, computation, or mathematical work.
title: "[Problem]: "
labels: ["problem-proposal", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Submission does not make a statement canonical, a status current, or a mathematical claim verified. Bind exact sources and identify what remains unchecked.
  - type: input
    id: statement_source
    attributes:
      label: Authoritative problem source
      placeholder: URL, DOI, problem number, book/page, or paper/theorem
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Exact statement and conventions
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Evidence that the status was checked
      description: Include dates, databases, and primary sources already inspected.
    validations:
      required: true
  - type: textarea
    id: packets
    attributes:
      label: Suggested bounded packets
      description: Literature, special case, counterexample, computation, formalization, or other useful work.
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Material AI or software use
      description: Give a sanitized summary or write "none". Do not paste raw prompts, transcripts, chain-of-thought, credentials, personal data, unpublished communications, or unrelated local material.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I have identified any third-party material and understand that each new component I intentionally submit is dedicated under CC0 to the extent legally possible.
          required: true
