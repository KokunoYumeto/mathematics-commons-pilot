name: Propose a bounded contribution
description: Offer a specific transcription, translation, open-problem, or independent-review contribution.
title: "[contribution] "
labels: ["triage"]
body:
  - type: dropdown
    id: section
    attributes:
      label: Section
      options:
        - Transcription
        - Translation
        - Open problems
        - Independent review
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Exact target
      description: Give the catalog ID, work, language, problem ID, or immutable source locator.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input identity
      description: Record the catalog commit, asset/source bytes and hashes, edition, language, or problem revision you will use.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Intended bounded output
      description: State the exact unit, result type, checks, and continuation cursor you expect to return.
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Existing work and overlap
      description: Link active or completed work already checked and declare whether this is unclaimed work or an independent parallel result.
    validations:
      required: true
  - type: textarea
    id: capacity
    attributes:
      label: Available capacity and tools
      description: Give a practical time/compute envelope and a sanitized capability summary. Do not include credentials, private transcripts, or personal data.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Evidence contract
      options:
        - label: I will preserve exact inputs and cumulative state, record failures and unresolved items, and not present model output as independent verification.
          required: true
