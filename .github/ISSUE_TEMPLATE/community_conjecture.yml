name: Propose a community conjecture
description: Submit a precise conjecture with definitions, motivation, evidence, and known limitations.
title: "[Conjecture]: "
labels: ["community-conjecture", "triage"]
body:
  - type: textarea
    id: statement
    attributes:
      label: Exact conjecture
      description: State quantifiers, definitions, domain, conventions, and edge cases.
    validations:
      required: true
  - type: textarea
    id: origin
    attributes:
      label: Origin and attribution
      description: Who proposed it, where, and when? Link a lawfully publishable public source when possible; otherwise give a sanitized attribution note. Do not quote or link a private discussion without the required consent.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Motivation and evidence
      description: Examples, computations, heuristics, or related theorems. Distinguish each evidence type.
    validations:
      required: true
  - type: textarea
    id: literature
    attributes:
      label: First literature search
      description: What was searched, which sources were opened, and what remains uncertain?
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Material AI or software use
      description: Give a sanitized summary or write "none". Do not paste raw prompts, transcripts, chain-of-thought, credentials, personal data, unpublished communications, or unrelated local material.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I have identified any third-party material and understand that each new component I intentionally submit is dedicated under CC0 to the extent legally possible.
          required: true
