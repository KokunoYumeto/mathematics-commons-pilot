name: Portal or documentation correction
description: Report a specific error, omission, ambiguity, or interface proposal.
title: "[documentation] "
labels: ["documentation", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Transcription
        - Translation
        - Open problems
        - Catalog or schema
        - Validation or public readback
        - Rights and attribution
        - Accessibility
        - Repository structure
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Exact section or file
      placeholder: "docs/translations.md or catalog/jobs.json"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Feedback
      description: State the objection, proposal, or question as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, examples, or sources
  - type: textarea
    id: tools
    attributes:
      label: Material AI or software use
      description: Give a sanitized summary or write "none". Do not paste raw prompts, transcripts, chain-of-thought, credentials, personal data, unpublished communications, or unrelated local material.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I have identified any third-party material and understand that each new component I intentionally submit is dedicated under CC0 to the extent legally possible.
          required: true
