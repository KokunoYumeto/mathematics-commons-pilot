name: Concept feedback
description: Criticize, extend, or ask a precise question about the white paper or pilot design.
title: "[Concept]: "
labels: ["concept", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Leiden alignment
        - Mathematical review
        - GitHub architecture
        - Participation and accessibility
        - Rights and attribution
        - Privacy and proportional disclosure
        - Security and resource use
        - Pilot scope
        - Future direction
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Exact section or file
      placeholder: "WHITE_PAPER.md §6 or GITHUB_PILOT_GUIDE.md §10"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Feedback
      description: State the objection, proposal, or question as concretely as possible.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, examples, or sources
  - type: textarea
    id: tools
    attributes:
      label: Material AI or software use
      description: Give a sanitized summary or write "none". Do not paste raw prompts, transcripts, chain-of-thought, credentials, personal data, unpublished communications, or unrelated local material.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I have identified any third-party material and understand that each new component I intentionally submit is dedicated under CC0 to the extent legally possible.
          required: true
