name: Start a mathematical translation
description: Declare one work, target language, source boundary, license, coverage check, and handback plan.
title: "[translation] "
body:
  - type: markdown
    attributes:
      value: |
        Start from docs/translations.md, catalog/translations.json, or the exact interlanguage adoption snapshot. Candidate or conditional status does not waive source, license, component, and baseline-build preflight. No-Derivatives, rights-unknown, donor, reference, and rejected entries are not translation jobs.
  - type: input
    id: source
    attributes:
      label: Translation-catalog ID
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Target language
      description: Give the exact language, locale, script, orthographic standard, and educational use.
    validations:
      required: true
  - type: textarea
    id: source_identity
    attributes:
      label: Exact source and license identity
      description: Repository URL, commit/tag/tree, edition, license version, component boundary, and baseline build receipt.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Bounded scope and cursor
      description: Complete work or first complete unit, included/excluded components, and exact next cursor.
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Existing editions and declared overlap
      description: Link work-specific language coverage and active work. Explain why a parallel edition is independently useful, or state that no overlap was identified after checking the exact snapshot.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Planned production and independent QA
      description: Source, mathematical, language, exercise/solution, build, visual, accessibility, and component-license checks.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Translation contract
      options:
        - label: I will produce a standalone monolingual edition, preserve stable semantics and component licenses, return cumulative full state, and publish exact manifests, failures, and a continuation cursor.
          required: true
