name: Start a mathematical translation
description: Declare one work, target language, source boundary, license, coverage check, and handback plan.
title: "[translation] "
body:
  - type: markdown
    attributes:
      value: |
        Start from docs/translations.md, catalog/translations.json, or propose another mathematical work with a verifiable open source and derivative license. The older-manuscript adoption snapshot is a separate catalog. Every work requires source, license, component, and baseline-build preflight; a reported edition is coverage information, not proof of source readiness.
  - type: input
    id: source
    attributes:
      label: Work title and public identity
      description: Give the semantic catalog key or an exact public source URL. Do not use a deprecated R/O planning key.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Target language
      description: Give the exact language, locale, script, orthographic standard, and educational use.
    validations:
      required: true
  - type: textarea
    id: source_identity
    attributes:
      label: Exact source and license identity
      description: Repository URL, commit/tag/tree, edition, license version, component boundary, and baseline build receipt.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Bounded scope and cursor
      description: Complete work or first complete unit, included/excluded components, and exact next cursor.
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: Existing editions and declared overlap
      description: Link work-specific verified editions and reported editions. Unknown coverage is not absence. Explain why a parallel edition is independently useful, or state exactly what sources you checked.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Planned production and independent QA
      description: Source, mathematical, language, exercise/solution, build, visual, accessibility, and component-license checks.
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Translation contract
      options:
        - label: I will produce a standalone monolingual edition, preserve stable semantics and component licenses, return cumulative full state, and publish exact manifests, failures, and a continuation cursor.
          required: true
