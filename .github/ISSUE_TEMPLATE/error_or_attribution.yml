name: Report an error, rights issue, or attribution concern
description: Challenge an exact claim, source, credit, license, or workflow decision.
title: "[Challenge]: "
labels: ["challenge", "triage"]
body:
  - type: input
    id: target
    attributes:
      label: Exact target
      placeholder: File, section, claim ID, commit, release, or DOI
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Concern type
      options:
        - Mathematical correctness
        - Citation or prior art
        - Credit or attribution
        - Copyright, license, or training consent
        - Tool disclosure
        - Security or privacy
        - Governance or communication
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Concern and evidence
    validations:
      required: true
  - type: textarea
    id: remedy
    attributes:
      label: Suggested correction or next check
  - type: textarea
    id: tools
    attributes:
      label: Material AI or software use
      description: Give a sanitized summary or write "none". Do not paste raw prompts, transcripts, chain-of-thought, credentials, personal data, unpublished communications, or unrelated local material.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I have identified any third-party material and understand that each new component I intentionally submit is dedicated under CC0 to the extent legally possible.
          required: true
