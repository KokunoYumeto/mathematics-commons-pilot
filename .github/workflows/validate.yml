name: Validate public concept repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact submitted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run structural validation
        run: python3 tools/validate_repository.py

